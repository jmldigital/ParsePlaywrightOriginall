version: '3.8'

services:
  price-parser:
    build: .
    container_name: price-parser-bot-crowly
    
    # ⚡ Важно для Playwright: общая память
    ipc: host
    shm_size: '4gb'
    
    volumes:
      - .:/app
      # Исключаем venv, чтобы локальная папка не ломала контейнер
      - /app/.venv
      
      - ./output:/app/output
      - ./input:/app/input
      - ./temp:/app/temp
      - ./logs:/app/logs
      
      # Кэш Crawlee
      - ./cache:/app/cache
      - ./cookies:/app/cookies

    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      # В образе mcr...v1.34.0 браузеры лежат здесь
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    restart: unless-stopped