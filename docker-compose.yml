services:
  stparts-price-api:
    build: .
    container_name: stparts-price-api
    init: true
    restart: unless-stopped
    env_file: ${API_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /app/data/jobs.sqlite3
      GLOBAL_CONCURRENCY: ${GLOBAL_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - stparts-api-data:/app/data
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  stparts-api-data:
