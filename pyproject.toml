[project]
name = "price-parser"
version = "0.1.0"
description = "Автоматический парсер цен для автозапчастей"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.1.3",
    "openpyxl==3.1.2",
    "xlrd==2.0.1",

    "Pillow>=10.0.0",  
    
    "apify-fingerprint-datapoints==0.7.0",  # 👈 ФИКС: точная версия!
    "crawlee[playwright]==1.3.0",

    # Парсинг
    "playwright==1.34.0",
    "crawlee==1.3.0",
    
    # Сеть и API
    "requests==2.31.0",
    "httpx==0.28.1",
    "aiohttp",       # 👈 ИСПРАВЛЕНО (без версии)
    
    "2captcha-python==1.2.1",
    "python-telegram-bot==21.0.1",
    
    # Утилиты
    "python-dotenv==1.0.0",
    "colorama==0.4.6",
    "tqdm==4.66.1",
    "psutil==7.2.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"